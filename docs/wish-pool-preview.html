<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MU 许愿池 · 布局预览</title>
<link rel="icon" href="../website/public/assets/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#f2f7fb;font:14px "Microsoft YaHei UI","PingFang SC",sans-serif;min-width:1200px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:88px;border-bottom:1px solid #18202c;padding:12px 24px;position:relative;background:linear-gradient(100deg,#0d1519,#080d15)}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;width:200px;height:40px}.brand img{width:48px;height:36px;object-fit:contain}nav{display:inline-flex;gap:7px}nav span{padding:10px 19px;border-radius:12px;font-weight:600;color:#94a1af}nav .active{background:#152119;color:#adff18}.utility{position:absolute;right:24px;top:18px;color:#94a1af;display:flex;gap:22px}.update{position:absolute;right:24px;bottom:8px;border:0;border-radius:10px;background:#adff18;padding:7px 21px;color:#081007}.preview-label{position:absolute;left:24px;bottom:8px;font-size:10px;color:#778699}main{margin:10px 41px 24px 24px}.hero{height:218px;position:relative;background:url('../assets/mu-wish-pool-hero.png') center/cover;border-radius:18px;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,#05080d);pointer-events:none}.hero h1{position:absolute;left:8px;top:14px;margin:0;font-size:40px;line-height:58px;letter-spacing:1px}.beta{font-size:12px;letter-spacing:0;vertical-align:middle;margin-left:16px;background:#6ada5d;color:#08190d;padding:6px 14px;border-radius:12px}.hero h2{position:absolute;left:10px;top:86px;margin:0;font-size:23px}.hero p{position:absolute;left:10px;top:130px;margin:0;color:#94a1af;line-height:1.8;font-size:15px}.bubble{position:absolute;border:1px solid #6264a3;border-radius:14px;background:linear-gradient(145deg,#3a3c70e6,#25274fe6);padding:11px 17px;color:#cdd3ff;font-size:12px;box-shadow:0 0 20px #6264a335}.b1{left:49%;top:50px}.b2{left:76%;top:10px}.b3{right:21px;top:140px}.composer{height:232px;position:relative;border-radius:18px;border:1px solid transparent;background:linear-gradient(180deg,#161c2e,#0b111a) padding-box,linear-gradient(100deg,#3aa0ba,#849239) border-box;box-shadow:inset 0 0 24px #1a6b8a12}.composer h2{position:absolute;left:24px;top:19px;margin:0;font-size:22px}.sparkle{color:#b2ed77;margin-right:8px}.composer>p{position:absolute;left:25px;top:60px;margin:0;color:#94a1af;line-height:26px}.input-box{position:absolute;left:24px;top:96px;width:calc(100% - 258px);height:112px;background:#131a24;border:1px solid #233041;border-radius:14px}.input-box textarea{resize:none;position:absolute;left:14px;top:12px;width:calc(100% - 28px);height:58px;background:none;border:0;color:#f2f7fb;outline:none;font-size:13px}.input-box textarea::placeholder{color:#94a1af}.attach{position:absolute;left:8px;bottom:6px;background:none;border:0;color:#94a1af;padding:7px 12px}.counter{position:absolute;right:16px;bottom:13px;color:#94a1af;font-size:12px}.submit{position:absolute;right:24px;bottom:24px;height:62px;width:191px;border:0;border-radius:15px;background:linear-gradient(90deg,#7be682,#eaf061);color:#0a180a;font-size:17px;font-weight:700}.toolbar{height:44px;margin-top:22px;display:flex;align-items:flex-start;gap:10px}.toolbar button{height:38px;min-width:86px;border-radius:12px;background:#0b111a;color:#94a1af;border:1px solid #233041;font-size:12px}.toolbar button.active{color:#adff18;border-color:#8cc75b;background:linear-gradient(#152119,#1d2c20);box-shadow:inset 0 0 14px #90d44520}.toolbar input{margin-left:4px;flex:1;min-width:120px;height:38px;border-radius:12px;padding:0 16px;background:#0b111a;color:#f2f7fb;border:1px solid #233041;outline:none}.toolbar select{height:38px;width:124px;border:1px solid #233041;border-radius:12px;background:#0b111a;color:#f2f7fb;padding:0 12px}.feedback{height:34px;color:#94a1af;font-size:12px;padding:4px 3px}.rows{display:grid;gap:8px}.wish{height:108px;position:relative;border-radius:15px;border:1px solid #233041;background:linear-gradient(115deg,#0d141e,#090e16)}.vote{position:absolute;left:8px;top:12px;width:68px;height:84px;border:0;border-radius:12px;background:#131a24;color:#f2f7fb;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-weight:700;font-size:17px}.vote span{font-size:24px;line-height:24px}.wish h3{position:absolute;left:112px;top:9px;margin:0;font-size:17px;line-height:28px;max-width:calc(100% - 410px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wish p{position:absolute;left:112px;top:39px;margin:0;width:calc(100% - 410px);height:38px;line-height:19px;color:#94a1af;font-size:13px;overflow:hidden}.tags{position:absolute;left:112px;top:80px;color:#6db1ea;font-size:11px;display:flex;gap:10px}.tags span{background:#092439;border:1px solid #164263;padding:2px 9px;border-radius:10px}.tags .demo{background:#18202b;border-color:#273245;color:#a0abba}.status{position:absolute;right:186px;top:20px;padding:7px 12px;border:1px solid currentColor;border-radius:8px;font-size:12px;background:#152119}.planned{color:#59e073}.developing{color:#6ea4ff;background:#101d37}.completed{color:#b7e763}.pending{color:#94a1af;background:#17202b}.author{position:absolute;right:16px;top:47px;width:135px;color:#94a1af;font-size:13px}.date{position:absolute;right:16px;top:77px;width:135px;color:#94a1af;font-size:11px}.comments{position:absolute;right:18px;top:17px;width:133px;color:#94a1af;font-size:12px}.footer{display:flex;justify-content:center;align-items:center;gap:20px;color:#94a1af;height:64px;font-size:12px}.footer button{background:#0b111a;color:#94a1af;border:1px solid #233041;padding:8px 22px;border-radius:10px}.empty{padding:35px;text-align:center;color:#94a1af}@media(max-width:1300px){nav span{padding:10px 12px}.utility{gap:13px}}
</style>
<style>.hero{background-color:#05080d;background-size:cover;background-position:center 40%;background-repeat:no-repeat}.hero:after{background:none}.b2{left:84%}</style>
<header><div class="brand"><img src="../website/public/assets/favicon.svg" alt="MU"> AMD DLSS MU</div><nav><span>兼容性</span><span>游戏库</span><span>大力喜鹊</span><span class="active">许愿池</span><span>下载任务</span><span>帮助与反馈</span></nav><div class="utility">☼　 ZH <span>我的账户</span><span>设置</span><span>—　□　×</span></div><button class="update" disabled>检查更新 ↗</button><div class="preview-label">布局预览 · 示例数据 · WinForms 实际显示需在 Windows 验收</div></header>
<main>
<section class="hero"><h1>许愿池<span class="beta">BETA</span></h1><h2>把你想要的功能告诉我们</h2><p>你的每一个建议都可能成为下一个版本的功能<br>和大家一起，让 AMD DLSS MU 变得更好。</p><span class="bubble b1">自动选择最佳方案</span><span class="bubble b2">支持更多游戏</span><span class="bubble b3">更好看的 UI</span></section>
<section class="composer"><h2><span class="sparkle">✦</span> 写下你的愿望</h2><p>告诉我们你希望增加的功能、改进建议或遇到的问题，我们会认真阅读每一条建议。</p><div class="input-box"><textarea maxlength="500" placeholder="例如：希望增加自动选择最优渲染方案、支持某款游戏、优化 UI 界面、修复某个问题等…" aria-label="愿望内容"></textarea><button class="attach" disabled>▧　添加图片（可选）</button><span class="counter">0/500</span></div><button class="submit" disabled>➤　提交愿望</button></section>
<section class="toolbar" aria-label="愿望筛选"><button data-filter="all" class="active">全部 8</button><button data-filter="hot">热门 8</button><button data-filter="planned">已计划 2</button><button data-filter="developing">开发中 2</button><button data-filter="completed">已完成 1</button><button data-filter="mine">我的 0</button><input type="search" placeholder="搜索功能建议…" aria-label="搜索愿望"><select aria-label="排序"><option value="newest">最新发布</option><option value="votes">最多支持</option></select></section>
<div class="feedback">标有「示例」的内容为演示数据；提交、投票与评论请在客户端使用。</div><section class="rows"></section><div class="footer"><button disabled>上一页</button><span class="page-count"></span><button disabled>下一页</button></div>
</main>
<script>
const items=[
['自动选择最优渲染方案','根据显卡型号、游戏类型和当前场景，自动推荐合适的渲染方案，无需手动调整。','planned',256,'玩家小熊'],
['支持更多游戏的自动识别','希望能自动识别 Epic、GOG、战网中的游戏，并显示游戏封面。','developing',189,'夜色'],
['游戏内菜单自定义快捷键','希望可以自定义呼出菜单的快捷键。目前默认 End，有些游戏会冲突。','completed',142,'Void'],
['增加游戏画质对比截图','希望在游戏详情页查看开启前后的画质对比截图，方便直观了解效果。','planned',98,'糖醋排骨'],
['为每个游戏保存独立配置','不同游戏的超分、帧生成和锐化参数可以分别保存，下次启动自动恢复。','pending',87,'星河'],
['下载任务支持断点续传','网络中断后继续下载组件，显示下载速度和剩余时间。','developing',76,'北极光'],
['增加更清晰的安装指引','初次配置时展示安装步骤和常见问题说明，让新用户更容易上手。','pending',64,'橘子汽水'],
['增加游戏内性能面板','希望能查看帧率、帧时间和显存占用，帮助判断配置效果。','pending',53,'远山']
].map((a,i)=>({title:a[0],content:a[1],status:a[2],votes:a[3],author:a[4],date:`2026-10-${String(8-i).padStart(2,'0')}`}));
const statuses={planned:'♧ 已计划',developing:'开发中',completed:'✓ 已完成',pending:'待评估'};
let filter='all';
function render(){let visible=items.filter(w=>(filter==='all'||filter==='hot'&&w.votes>=50||w.status===filter)&&[w.title,w.content].some(s=>s.includes(document.querySelector('input[type=search]').value.trim())));if(document.querySelector('select').value==='votes')visible.sort((a,b)=>b.votes-a.votes);const rows=document.querySelector('.rows');rows.replaceChildren();for(const w of visible){const row=document.createElement('article');row.className='wish';row.innerHTML=`<button class="vote" disabled><span>⌃</span>${w.votes}</button><h3></h3><p></p><div class="tags"><span>功能建议</span><span class="demo">示例</span></div><span class="status ${w.status}">${statuses[w.status]}</span><span class="comments">♧　评论 0</span><span class="author"></span><span class="date">${w.date}</span>`;row.querySelector('h3').textContent=w.title;row.querySelector('p').textContent=w.content;row.querySelector('.author').textContent=w.author;rows.append(row)}if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='还没有找到愿望，试试其他筛选条件。';rows.append(empty)}document.querySelector('.page-count').textContent=`1 / 1 · ${visible.length} 条`}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelector('input[type=search]').addEventListener('input',render);document.querySelector('select').addEventListener('change',render);document.querySelector('textarea').addEventListener('input',e=>document.querySelector('.counter').textContent=`${e.target.value.length}/500`);render();
</script>
</html>
